; PlatformIO project for the Seeed reTerminal E1001 firmware that polls
; my-assistant's /api/v1/display endpoint hourly and paints the result on
; the onboard e-ink panel. See README.md for first-time setup and
; CLAUDE.md for architecture notes.

[platformio]
extra_configs = secrets.ini
default_envs = reterminal_e1001

[env:reterminal_e1001]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
build_flags =
    -D BOARD_HAS_PSRAM
    ; The USB-C port is bridged via CH340 to UART0 (GPIO43/44), not the
    ; ESP32-S3's native USB-CDC peripheral -- without this flag, Serial
    ; output silently goes nowhere on this board (see CLAUDE.md).
    -D ARDUINO_USB_CDC_ON_BOOT=0
    ${secrets.build_flags}
lib_deps =
    ; Only used by eink_driver.cpp's drawErrorScreen() (per-pixel text for
    ; the rare repeated-failure indicator) -- the main drawFrame() path
    ; writes the panel's raw bit planes directly, no framebuffer library
    ; needed there.
    adafruit/Adafruit GFX Library@^1.11.9
monitor_speed = 115200

[env:native]
; Runs the pure-logic unit tests (time_scheduler) on the host machine, no
; ESP32 hardware needed. Everything else in src/ depends on Arduino/ESP-IDF
; headers and is intentionally excluded here via build_src_filter.
platform = native
build_flags = -std=gnu++17
build_src_filter = -<*> +<time_scheduler.cpp>
